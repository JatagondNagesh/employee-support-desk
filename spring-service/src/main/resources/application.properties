server.port=8080
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=always

# Python service (document extraction, policy retrieval, answer generation)
policy-engine.base-url=http://localhost:8000
policy-engine.connect-timeout-ms=2000
policy-engine.read-timeout-ms=10000

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# Bounds the work behind one synchronous /batches call (one engine call per document).
batch.max-documents=25

logging.level.com.marlabs.desk=INFO
